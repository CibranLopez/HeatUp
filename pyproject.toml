[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "heatup"
version = "0.3.0"
description = "Temperature-aware thermodynamic and mechano-elastic stability screening with machine-learning potentials"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "ase>=3.23", "phonopy>=2.20", "pymatgen", "spglib", "matplotlib"]

[project.optional-dependencies]
mace = ["mace-torch"]
mp = ["mp-api"]
generate = ["pyxtal"]
test = ["pytest"]
notebooks = ["pandas", "jupyter", "ipykernel"]

[tool.setuptools.packages.find]
include = ["heatup*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: end-to-end runs with the EMT test potential (minutes); run with `pytest -m slow`"]
filterwarnings = ["ignore::DeprecationWarning"]
